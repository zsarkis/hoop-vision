[tool.poetry]
name = "hoop-vision"
version = "0.1.0"
description = "NBA game prediction using computer vision and graph ML"
authors = ["Zach Sarkis"]

[tool.poetry.dependencies]
python = "^3.10"
opencv-python = "^4.8.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
networkx = "^3.1"
torch = "^2.0.0"
ultralytics = "^8.0.0"  # YOLOv8
xgboost = "^2.0.0"
scikit-learn = "^1.3.0"
matplotlib = "^3.7.0"
jupyter = "^1.0.0"
pyyaml = "^6.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.0.285"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
